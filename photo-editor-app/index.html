<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PixelVeil</title>
<meta name="theme-color" content="#1b1f24">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===== 上部バー ===== -->
  <header id="topbar">
    <button id="btn-close-photo" class="icon-btn" title="別の写真を選ぶ" aria-label="別の写真を選ぶ">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
    </button>
    <button id="btn-reset" class="icon-btn" title="リセット" aria-label="リセット">
      <svg viewBox="0 0 24 24"><path d="M12 5V2L7 7l5 5V9a5 5 0 1 1-5 5H5a7 7 0 1 0 7-9z"/></svg>
    </button>
    <div id="filename">写真を選択してください</div>
    <button id="btn-save" class="icon-btn primary" title="保存" aria-label="保存" disabled>
      <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM7 5h7v4H7V5z"/></svg>
    </button>
  </header>

  <!-- ===== 写真未選択時の画面 ===== -->
  <section id="picker-screen">
    <div class="picker-card">
      <div class="picker-icon">
        <svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
          <rect x="6" y="10" width="44" height="34" rx="6"/>
          <circle cx="20" cy="22" r="4"/>
          <path d="M10 38 L24 26 L34 34 L44 24 L50 34"/>
          <path d="M40 33 L52.5 33 L52.5 45.5 C52.5 51.5 46.5 55.5 46.5 55.5 C46.5 55.5 40 51.5 40 45.5 Z" fill="#14171a" stroke-width="2"/>
        </svg>
      </div>
      <h1>PixelVeil</h1>
      <p>クロップ・EXIF焼き込み・顔/ナンバー隠しを<br>すべて端末内だけで行います。写真は外部へ送信されません。</p>
      <label class="btn-primary" for="file-input">写真を選ぶ</label>
      <input type="file" id="file-input" accept="image/*">
      <label class="btn-secondary" for="camera-input">カメラで撮影</label>
      <input type="file" id="camera-input" accept="image/*" capture="environment">
    </div>
  </section>

  <!-- ===== 編集画面 ===== -->
  <section id="editor-screen" hidden>

    <div id="canvas-wrap">
      <canvas id="preview"></canvas>
      <!-- クロップ用オーバーレイ(枠をドラッグ/ハンドルでリサイズして範囲指定) -->
      <div id="crop-overlay" hidden>
        <div id="crop-frame">
          <div class="crop-handle" data-handle="n"></div>
          <div class="crop-handle" data-handle="s"></div>
          <div class="crop-handle" data-handle="e"></div>
          <div class="crop-handle" data-handle="w"></div>
          <div class="crop-handle corner" data-handle="nw"></div>
          <div class="crop-handle corner" data-handle="ne"></div>
          <div class="crop-handle corner" data-handle="sw"></div>
          <div class="crop-handle corner" data-handle="se"></div>
        </div>
      </div>
      <!-- 検出枠オーバーレイ(顔/ナンバー) -->
      <svg id="hide-overlay" hidden></svg>
      <div id="canvas-hint" class="hint" hidden></div>
    </div>

    <!-- ===== コンテキストパネル(モードごとの操作) ===== -->
    <div id="panel-crop" class="panel" hidden>
      <div class="aspect-scroll" id="aspect-scroll">
        <button class="g-card on r-free" data-aspect="free"><div class="ratio-box"><i></i></div><span class="g-label">自由</span></button>
        <button class="g-card r-orig" data-aspect="orig"><div class="ratio-box"><i></i></div><span class="g-label">元比率</span></button>
        <button class="g-card r-1-1" data-aspect="1:1"><div class="ratio-box"><i></i></div><span class="g-label">1:1</span></button>
        <button class="g-card r-4-3" data-aspect="4:3"><div class="ratio-box"><i></i></div><span class="g-label">4:3</span></button>
        <button class="g-card r-3-4" data-aspect="3:4"><div class="ratio-box"><i></i></div><span class="g-label">3:4</span></button>
        <button class="g-card r-16-9" data-aspect="16:9"><div class="ratio-box"><i></i></div><span class="g-label">16:9</span></button>
        <button class="g-card r-9-16" data-aspect="9:16"><div class="ratio-box"><i></i></div><span class="g-label">9:16</span></button>
      </div>
      <div class="panel-row action-row">
        <button id="crop-cancel" class="btn-flat">キャンセル</button>
        <button id="crop-apply" class="btn-flat primary">適用</button>
      </div>
    </div>

    <div id="panel-exif" class="panel" hidden>
      <div id="exif-empty" class="hint-text" hidden>この写真にはEXIF情報が見つかりませんでした。</div>
      <div id="exif-fields" class="field-grid"></div>
      <p class="field-hint">タップして写真に焼き込む項目を選択(点灯 = 表示する)</p>
      <div class="panel-row">
        <button id="exif-disable-all" class="btn-flat">すべて無効にする</button>
      </div>

      <div class="row">
        <span class="row-label">位置</span>
        <div class="mini-grid" id="exif-position">
          <button class="mini-card on" data-pos="left"><div class="pos-icon pos-left"><i></i><i></i><i></i></div><span class="m-label">左</span></button>
          <button class="mini-card" data-pos="center"><div class="pos-icon pos-center"><i></i><i></i><i></i></div><span class="m-label">中央</span></button>
          <button class="mini-card" data-pos="right"><div class="pos-icon pos-right"><i></i><i></i><i></i></div><span class="m-label">右</span></button>
        </div>
      </div>

      <div class="row">
        <span class="row-label">文字サイズ</span>
        <input type="range" id="exif-size" min="12" max="64" value="26">
      </div>

      <div class="row">
        <span class="row-label">文字色</span>
        <div class="mini-grid" id="exif-color">
          <button class="mini-card on" data-color="white"><div class="mini-swatch" style="background:#fff"></div></button>
          <button class="mini-card" data-color="black"><div class="mini-swatch" style="background:#000"></div></button>
          <button class="mini-card" data-color="orange"><div class="mini-swatch" style="background:#e8a33d"></div></button>
          <button class="mini-card" data-color="custom"><div class="mini-swatch custom-swatch" id="exif-color-custom-preview"></div></button>
        </div>
        <input type="color" id="exif-color-custom" value="#ffffff" style="position:absolute; width:1px; height:1px; opacity:0; border:none; padding:0; pointer-events:none;">
      </div>

      <div class="row">
        <span class="row-label">縁取り</span>
        <div class="mini-grid" id="exif-outline">
          <button class="mini-card on ol-white-black" data-outline="white-black"><span class="mini-outline">Aa</span><span class="m-label">白+黒</span></button>
          <button class="mini-card ol-black-white" data-outline="black-white"><span class="mini-outline">Aa</span><span class="m-label">黒+白</span></button>
          <button class="mini-card ol-none" data-outline="none"><span class="mini-outline">Aa</span><span class="m-label">なし</span></button>
        </div>
      </div>

      <div class="panel-row action-row">
        <button id="exif-cancel" class="btn-flat">キャンセル</button>
        <button id="exif-apply" class="btn-flat primary">適用</button>
      </div>
    </div>

    <div id="panel-hide" class="panel" hidden>
      <div id="hide-status" class="hint-text">検出待機中…</div>
      <div class="panel-row action-row">
        <button id="hide-detect" class="btn-flat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-3px;margin-right:4px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          自動検出
        </button>
        <button id="hide-add" class="btn-flat">＋追加</button>
      </div>
      <div class="row">
        <span class="row-label">隠し方</span>
        <div class="mini-grid" id="hide-method">
          <button class="mini-card on" data-method="mosaic"><div class="method-icon mosaic-mini"></div><span class="m-label">モザイク</span></button>
          <button class="mini-card" data-method="icon"><div class="method-icon" id="hide-method-icon-preview">🕶️</div><span class="m-label">アイコン</span></button>
        </div>
      </div>
      <div class="row" id="hide-icon-row" hidden>
        <span class="row-label">アイコン</span>
        <div class="icon-scroll" id="hide-icon-choice">
          <button class="icon-card on" data-icon="🕶️">🕶️</button>
          <button class="icon-card" data-icon="⬛">⬛</button>
          <button class="icon-card" data-icon="😶">😶</button>
          <button class="icon-card" data-icon="😷">😷</button>
          <button class="icon-card" data-icon="🚫">🚫</button>
          <button class="icon-card" data-icon="❓">❓</button>
        </div>
      </div>
      <div class="section-title">検出・追加された範囲</div>
      <div id="hide-list" class="hide-list"></div>
    </div>

    <!-- ===== 下部固定メニュー ===== -->
    <nav id="bottombar">
      <button class="tab-btn active" data-mode="crop">
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        <span>クロップ</span>
      </button>
      <button class="tab-btn" data-mode="exif">
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17c0 .53.21 1.04.59 1.41l8 8a2 2 0 0 0 2.82 0l7.17-7.17a2 2 0 0 0 0-2.82z"/><circle cx="7.5" cy="7.5" r="1.4" fill="currentColor" stroke="none"/></svg>
        <span>EXIF</span>
      </button>
      <button class="tab-btn" data-mode="hide">
        <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>隠す</span>
      </button>
    </nav>
  </section>

  <div id="toast"></div>
  <div id="loading-overlay" hidden><div class="spinner"></div><div id="loading-text">読み込み中…</div></div>
</div>

<!-- exif-js / face-api.js は自前で同梱し(vendor/)、起動時には読み込まない(起動を重くしないため)。
     オフラインでも動くよう、これらもService Workerでキャッシュ対象にしている。写真データ自体は一切送信しない。 -->
<script src="app.js"></script>
</body>
</html>
