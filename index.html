<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMT's OPEN APP PAGE</title>
<style>
  :root {
    --mint-50:  #eafbf4;
    --mint-200: #a9ecd2;
    --mint-500: #2bb98f;
    --mint-600: #1f9a76;
    --mint-700: #157a5c;

    --bg:      #fbfefc;
    --surface: #ffffff;
    --surface-2: #f1faf6;
    --border:  #d7ece2;
    --text:    #12241d;
    --text-2:  #4d6b60;
    --tag-bg:  #eafbf4;
    --tag-text:#157a5c;
    --shadow: 0 1px 2px rgba(20, 60, 45, 0.06), 0 6px 16px rgba(20, 60, 45, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #0a1512;
      --surface: #10201a;
      --surface-2: #132a21;
      --border:  #1e3b30;
      --text:    #e7f7ef;
      --text-2:  #93b8a9;
      --tag-bg:  #16352a;
      --tag-text:#7bd8b4;
      --mint-500:#34caa0;
      --mint-600:#2bb98f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic UI", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s ease, color 0.25s ease;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header.page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .titles h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.3;
  }

  .titles h1 .dot {
    color: var(--mint-500);
  }

  .titles p {
    margin: 0;
    font-size: 13px;
    color: var(--text-2);
  }

  /* View toggle */
  .toggle {
    display: inline-flex;
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .toggle button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-2);
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .toggle button svg { width: 14px; height: 14px; display: block; }

  .toggle button[aria-pressed="true"] {
    background: var(--mint-500);
    color: #04231a;
  }

  /* App list container */
  #apps {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #apps.view-tile {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (max-width: 480px) {
    #apps.view-tile {
      grid-template-columns: 1fr;
    }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }

  .card:active {
    transform: scale(0.98);
  }

  @media (hover: hover) {
    .card:hover {
      border-color: var(--mint-500);
    }
  }

  #apps.view-list .card {
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
  }

  .card-icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--mint-600);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 700;
  }

  #apps.view-tile .card-icon {
    width: 34px;
    height: 34px;
    font-size: 15px;
  }

  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
  }

  .card-desc {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.5;
  }

  #apps.view-tile .card-desc {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-tag {
    align-self: flex-start;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 2px 7px;
    border-radius: 999px;
    margin-top: 2px;
  }

  footer {
    margin-top: 40px;
    font-size: 11.5px;
    color: var(--text-2);
    text-align: center;
  }

  :focus-visible {
    outline: 2px solid var(--mint-500);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <div class="titles">
        <h1>FMT's OPEN<span class="dot">.</span>APP<span class="dot">.</span>PAGE</h1>
        <p>自作アプリの公開ページ</p>
      </div>
      <div class="toggle" role="group" aria-label="表示切り替え">
        <button id="btn-list" aria-pressed="true" onclick="setView('list')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          リスト
        </button>
        <button id="btn-tile" aria-pressed="false" onclick="setView('tile')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
          タイル
        </button>
      </div>
    </header>

    <div id="apps" class="view-list"></div>

    <footer>© FMT — 個人開発アプリ集</footer>
  </div>

<script>
  var APPS = [
    {
      title: "老後資金シミュレーター(no-save)",
      url: "https://fmt-jp.github.io/open/retirement-simulator-no-save.html",
      desc: "基本情報と収入と支出を入力するだけのシンプルシミュレーター",
      tag: "生活"
    },
    {
      title: "老後資金シミュレーター２",
      url: "https://fmt-jp.github.io/open/rougo-sim/index.html",
      desc: "支出の入力方法を見直し、物価上昇率も設定できるようにしたバージョン",
      tag: "生活"
    },
    {
      title: "EXIF Overlay",
      url: "https://fmt-jp.github.io/open/exif-overlay-pwa/index.html",
      desc: "写真にEXIF情報を焼きこむだけのアプリ",
      tag: "写真加工, PWA"
    },
    {
      title: "PixelVeil",
      url: "https://fmt-jp.github.io/open/photo-editor-app/index.html",
      desc: "写真のクロップ、EXIF情報の焼み、顔/車のナンバーを加工するためのアプリ",
      tag: "開発中, 写真加工, PWA"
    }
  ];

  function initials(title) {
    var s = title.trim();
    return s.slice(0, 1);
  }

  function render() {
    var root = document.getElementById('apps');
    root.innerHTML = APPS.map(function (app) {
      return (
        '<a class="card" href="' + app.url + '">' +
          '<div class="card-icon">' + initials(app.title) + '</div>' +
          '<div class="card-body">' +
            (app.tag ? '<div class="card-tag">' + app.tag + '</div>' : '') +
            '<div class="card-title">' + app.title + '</div>' +
            (app.desc ? '<div class="card-desc">' + app.desc + '</div>' : '') +
          '</div>' +
        '</a>'
      );
    }).join('');
  }

  var currentView = 'list';

  function setView(view) {
    currentView = view;
    var root = document.getElementById('apps');
    root.classList.remove('view-list', 'view-tile');
    root.classList.add('view-' + view);
    document.getElementById('btn-list').setAttribute('aria-pressed', String(view === 'list'));
    document.getElementById('btn-tile').setAttribute('aria-pressed', String(view === 'tile'));
  }

  render();
  setView(currentView);
</script>
</body>
</html>
